<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om Akhatkar - Entrepreneur & Tech Developer from Amravati</title>
    <meta name="description" content="18-year-old Entrepreneur and Tech Developer from Amravati, Maharashtra, India">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Framer Motion -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        accent: '#FF6B00',
                        'accent-hover': '#e66000',
                    },
                }
            }
        }
    </script>

    <style>
        @layer base {
            html {
                scroll-behavior: smooth;
            }
            body {
                background-color: #0a0a0a;
                color: white;
                overflow-x: hidden;
                background-image: radial-gradient(rgba(255, 107, 0, 0.03) 1px, transparent 1px);
                background-size: 40px 40px;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 0, 0.4);
            border-radius: 9999px;
            border: 2px solid #0a0a0a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 107, 0, 0.6);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            transition: all 0.3s ease-in-out;
        }

        .text-gradient {
            background: linear-gradient(to right, #ffffff, #6b7280);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            position: relative;
            padding-bottom: 4px;
            color: #9ca3af;
            transition: color 0.3s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #FF6B00;
            transition: width 0.3s ease-out;
        }
        .nav-link:hover {
            color: white;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 16px;
            height: 16px;
            background-color: #FF6B00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease-out;
            mix-blend-difference: difference;
        }
        .custom-cursor.grow {
            transform: translate(-50%, -50%) scale(4);
            background-color: white;
        }

        .typewriter {
            overflow: hidden;
            border-right: .15em solid #FF6B00;
            white-space: nowrap;
            margin: 0 auto;
            letter-spacing: -0.02em;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.3);
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #FF6B00; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 107, 0, 0.4);
            pointer-events: none;
            filter: blur(1px);
            animation: float 20s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background-color: #FF6B00;
            z-index: 10000;
            transform-origin: 0%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence, useScroll, useSpring } = FramerMotion;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const CustomCursor = () => {
            const cursorRef = useRef(null);
            const [isHovering, setIsHovering] = useState(false);

            useEffect(() => {
                const moveCursor = (e) => {
                    if (cursorRef.current) {
                        cursorRef.current.style.left = `${e.clientX}px`;
                        cursorRef.current.style.top = `${e.clientY}px`;
                    }
                };
                const handleHover = (e) => {
                    const target = e.target;
                    setIsHovering(
                        target.tagName === "A" || 
                        target.tagName === "BUTTON" || 
                        target.closest("a") !== null || 
                        target.closest("button") !== null
                    );
                };
                window.addEventListener("mousemove", moveCursor);
                window.addEventListener("mouseover", handleHover);
                return () => {
                    window.removeEventListener("mousemove", moveCursor);
                    window.removeEventListener("mouseover", handleHover);
                };
            }, []);

            return <div ref={cursorRef} className={`custom-cursor ${isHovering ? "grow" : ""}`} />;
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            return (
                <motion.nav 
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    transition={{ duration: 0.8 }}
                    className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? "bg-black/80 backdrop-blur-md py-4 border-b border-white/10" : "bg-transparent py-6"}`}
                >
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <motion.div animate={{ scale: [1, 1.05, 1] }} transition={{ repeat: Infinity, duration: 4 }} className="text-xl font-bold tracking-tighter">
                            OM<span className="text-accent">.</span>
                        </motion.div>
                        <div className="hidden md:flex gap-8 text-sm font-medium">
                            {["About", "Projects", "Contact"].map((item) => (
                                <a key={item} href={`#${item.toLowerCase()}`} className="nav-link">{item}</a>
                            ))}
                        </div>
                    </div>
                </motion.nav>
            );
        };

        const Particles = () => {
            const [particles, setParticles] = useState([]);
            useEffect(() => {
                setParticles(Array.from({ length: 20 }).map((_, i) => ({
                    id: i,
                    left: `${Math.random() * 100}%`,
                    size: `${Math.random() * 4 + 2}px`,
                    delay: `${Math.random() * 10}s`,
                    duration: `${Math.random() * 10 + 10}s`,
                })));
            }, []);
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                    {particles.map((p) => (
                        <div key={p.id} className="particle" style={{ left: p.left, width: p.size, height: p.size, animationDelay: p.delay, animationDuration: p.duration, bottom: "-20px" }} />
                    ))}
                </div>
            );
        };

        const Hero = () => {
            const { scrollYProgress } = useScroll();
            const y = useSpring(scrollYProgress, { stiffness: 50, damping: 20 });

            return (
                <section className="min-h-screen flex flex-col justify-center items-center px-6 pt-20 relative overflow-hidden">
                    <Particles />
                    <motion.div style={{ y }} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-accent/10 rounded-full blur-[150px] -z-10" />
                    <div className="text-center max-w-3xl relative z-10">
                        <motion.span initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} className="inline-block px-4 py-1.5 mb-6 bg-accent text-black text-[10px] font-bold tracking-widest uppercase rounded-full shadow-[0_0_20px_rgba(255,107,0,0.3)]">
                            Available for new opportunities
                        </motion.span>
                        <div className="h-[100px] md:h-[140px] flex items-center justify-center mb-6">
                            <h1 className="text-6xl md:text-9xl font-extrabold tracking-tighter text-gradient typewriter">Om Akhatkar</h1>
                        </div>
                        <motion.p initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.8 }} className="text-xl md:text-2xl text-gray-400 mb-10 font-light leading-relaxed">
                            Driven by clarity. <span className="text-white font-medium">Operating with precision.</span>
                        </motion.p>
                        <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 1.2 }} className="flex flex-col sm:flex-row gap-4 justify-center">
                            <a href="#projects" className="px-8 py-4 bg-accent text-black font-bold rounded-full hover:scale-105 hover:shadow-[0_0_30px_rgba(255,107,0,0.4)] transition-all">View Projects</a>
                            <a href="#contact" className="px-8 py-4 border-2 border-accent/50 text-accent font-bold rounded-full hover:bg-accent hover:text-black hover:scale-105 transition-all">Get in Touch</a>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const About = () => {
            const skills = [
                { name: "React", level: 85 }, { name: "TypeScript", level: 80 }, { name: "Node.js", level: 75 },
                { name: "Tailwind CSS", level: 90 }, { name: "Next.js", level: 70 }, { name: "Firebase", level: 80 },
                { name: "Python", level: 70 }, { name: "UI/UX Design", level: 85 }
            ];
            return (
                <section id="about" className="py-24 px-6 max-w-7xl mx-auto overflow-hidden">
                    <div className="grid md:grid-cols-2 gap-16 items-center">
                        <motion.div initial={{ opacity: 0, x: -100 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ duration: 0.8 }} className="relative">
                            <div className="mb-12 flex justify-center md:justify-start">
                                <div className="relative w-48 h-48 md:w-64 md:h-64 rounded-full border-4 border-accent p-2">
                                    <div className="w-full h-full rounded-full bg-white/5 flex items-center justify-center overflow-hidden">
                                        <Icon name="user" size={80} className="text-accent/40" />
                                    </div>
                                    <div className="absolute -bottom-2 -right-2 bg-accent text-black p-3 rounded-full shadow-[0_0_20px_rgba(255,107,0,0.5)]">
                                        <Icon name="briefcase" size={20} />
                                    </div>
                                </div>
                            </div>
                            <h2 className="text-3xl md:text-4xl font-bold mb-8 flex items-center gap-4"><Icon name="user" className="text-accent" /> About Me</h2>
                            <div className="space-y-6 text-gray-400 text-lg">
                                <p>I'm <span className="text-white font-medium">Om Akhatkar</span>, an 18-year-old Entrepreneur and Tech Developer based in Amravati, Maharashtra.</p>
                                <p>I believe in the power of clean code and minimalist design. My approach is centered around clarity and precision.</p>
                                <div className="flex items-center gap-2 text-white"><Icon name="map-pin" size={18} className="text-accent" /><span>Amravati, Maharashtra, India</span></div>
                            </div>
                        </motion.div>
                        <motion.div initial={{ opacity: 0, x: 100 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ duration: 0.8 }} className="glass-card p-8 border-accent/20">
                            <h3 className="text-xl font-bold mb-8 flex items-center gap-3"><Icon name="code" className="text-accent" /> Technical Skills</h3>
                            <div className="space-y-6">
                                {skills.map((skill) => (
                                    <div key={skill.name} className="group">
                                        <div className="flex justify-between mb-2"><span className="text-sm font-medium text-white group-hover:text-accent transition-colors">{skill.name}</span><span className="text-xs text-gray-500">{skill.level}%</span></div>
                                        <div className="w-full h-2 bg-white/5 rounded-full overflow-hidden">
                                            <motion.div initial={{ width: 0 }} whileInView={{ width: `${skill.level}%` }} viewport={{ once: true }} transition={{ duration: 1, delay: 0.5 }} className="h-full bg-accent shadow-[0_0_10px_rgba(255,107,0,0.5)]" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Projects = () => {
            const projects = [
                { title: "Portfolio Website", description: "Personal portfolio built with HTML/CSS/JS, featuring modern animations.", tags: ["HTML", "CSS", "JS", "Motion"] },
                { title: "Digital Tools", description: "Collection of useful web tools for productivity.", tags: ["React", "TS", "Tailwind"] },
                { title: "AI Experiments", description: "Exploring AI APIs and building small apps.", tags: ["Gemini", "Node", "Firebase"] }
            ];
            return (
                <section id="projects" className="py-24 px-6 max-w-7xl mx-auto">
                    <motion.div initial={{ opacity: 0, y: 50 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} className="mb-16">
                        <h2 className="text-3xl md:text-4xl font-bold mb-4">Selected Projects</h2>
                        <p className="text-gray-400 max-w-2xl">A collection of some of my recent work.</p>
                    </motion.div>
                    <div className="grid md:grid-cols-3 gap-8">
                        {projects.map((project, index) => (
                            <motion.div key={project.title} initial={{ opacity: 0, scale: 0.9, y: 50 }} whileInView={{ opacity: 1, scale: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: index * 0.2 }} whileHover={{ y: -10, boxShadow: "0 20px 40px rgba(255,107,0,0.1)" }} className="glass-card p-6 group border-accent/10 hover:border-accent/30">
                                <div className="w-full aspect-video bg-white/5 rounded-xl mb-6 flex items-center justify-center text-gray-600 font-mono text-xs uppercase tracking-widest">Project Preview</div>
                                <h3 className="text-xl font-bold mb-3 group-hover:text-accent transition-colors">{project.title}</h3>
                                <p className="text-gray-400 text-sm mb-6 line-clamp-2">{project.description}</p>
                                <div className="flex flex-wrap gap-2 mb-8">{project.tags.map(tag => <span key={tag} className="text-[10px] uppercase tracking-wider font-bold text-accent px-2 py-1 bg-accent/10 rounded">{tag}</span>)}</div>
                                <motion.button whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} className="w-full py-3 bg-accent text-black font-bold rounded-lg flex items-center justify-center gap-2 hover:shadow-[0_0_20px_rgba(255,107,0,0.3)] transition-all">View Project <Icon name="external-link" size={16} /></motion.button>
                            </motion.div>
                        ))}
                    </div>
                </section>
            );
        };

        const Contact = () => {
            const socials = [
                { name: "Instagram", icon: "instagram", handle: "@mr.om_akhatkar", url: "#" },
                { name: "LinkedIn", icon: "linkedin", handle: "Om Akhatkar", url: "#" },
                { name: "GitHub", icon: "github", handle: "omakhatkar", url: "#" },
                { name: "Twitter", icon: "twitter", handle: "omakhatkar", url: "#" }
            ];
            return (
                <section id="contact" className="py-24 px-6 max-w-7xl mx-auto">
                    <motion.div initial={{ opacity: 0, y: 50 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} className="glass-card p-12 relative overflow-hidden border-accent/20">
                        <div className="absolute top-0 right-0 w-full h-full bg-gradient-to-br from-accent/10 via-transparent to-transparent -z-10" />
                        <div className="relative z-10 grid md:grid-cols-2 gap-16">
                            <motion.div initial={{ opacity: 0, x: -50 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }}>
                                <h2 className="text-4xl font-bold mb-6">Let's work together.</h2>
                                <p className="text-gray-400 text-lg mb-8">I'm always open to discussing new projects.</p>
                                <motion.a whileHover={{ scale: 1.02 }} href="mailto:omakhatkar10@gmail.com" className="text-2xl font-semibold text-accent flex items-center gap-3">omakhatkar10@gmail.com <Icon name="external-link" size={24} /></motion.a>
                            </motion.div>
                            <div className="grid grid-cols-2 gap-6">
                                {socials.map((social) => (
                                    <motion.a key={social.name} whileHover={{ y: -8, boxShadow: "0 20px 40px rgba(255,107,0,0.15)", borderColor: "rgba(255,107,0,0.4)", backgroundColor: "rgba(255,107,0,0.08)" }} href={social.url} className="flex flex-col gap-2 p-4 rounded-xl border border-transparent group">
                                        <motion.div className="text-accent" whileHover={{ scale: [1, 1.5, 1.2], rotate: [0, -10, 10, 0] }} transition={{ duration: 0.4 }}>
                                            <Icon name={social.icon} />
                                        </motion.div>
                                        <span className="text-sm font-bold group-hover:text-accent transition-colors">{social.name}</span>
                                        <span className="text-xs text-gray-500">{social.handle}</span>
                                    </motion.a>
                                ))}
                            </div>
                        </div>
                    </motion.div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-12 px-6">
                <div className="max-w-7xl mx-auto">
                    <div className="w-full h-px bg-gradient-to-r from-transparent via-accent/50 to-transparent mb-12" />
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="text-sm text-gray-500">© 2026 Om Akhatkar. All rights reserved.</div>
                        <div className="flex gap-8 text-sm text-gray-500"><a href="#" className="hover:text-white transition-colors">Privacy</a><a href="#" className="hover:text-white transition-colors">Terms</a></div>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [loading, setLoading] = useState(true);
            const { scrollYProgress } = useScroll();
            const scaleX = useSpring(scrollYProgress, { stiffness: 100, damping: 30 });
            useEffect(() => { setTimeout(() => setLoading(false), 1500); }, []);

            return (
                <div className="selection:bg-accent selection:text-white">
                    <AnimatePresence>
                        {loading && (
                            <motion.div key="loader" initial={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[10000] bg-[#0a0a0a] flex items-center justify-center">
                                <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-4xl font-bold tracking-tighter">OM<span className="text-accent">.</span></motion.div>
                                <motion.div className="absolute bottom-0 left-0 h-1 bg-accent" initial={{ width: 0 }} animate={{ width: "100%" }} transition={{ duration: 1.5 }} />
                            </motion.div>
                        )}
                    </AnimatePresence>
                    <motion.div className="progress-bar" style={{ scaleX }} />
                    <CustomCursor />
                    <Navbar />
                    <main><Hero /><About /><Projects /><Contact /></main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
